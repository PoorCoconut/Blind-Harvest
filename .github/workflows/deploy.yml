name: Export and Deploy to Itch.io

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: index.html

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Web Build
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/$EXPORT_NAME

      - name: Install and Setup Butler
        run: |
          apt-get update && apt-get install -y curl unzip
          # Download using an absolute link split safely onto its own line
          curl -L -o butler.zip "https://github.com"
          unzip -o butler.zip -d /usr/local/bin
          chmod +x /usr/local/bin/butler
          # Confirm the binary is working inside the container
          butler --version

      - name: Deploy to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          butler push build/web poorcoco/blind-harvest-game:html5
